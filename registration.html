```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">

    <div class="container">

        <a class="navbar-brand fw-bold" href="index.html">
            <i class="bi bi-calendar-event-fill"></i>
            EventHub
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="events.html">Events</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="gallery.html">Gallery</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="registration.html">
                        Registration
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- HEADER -->
<section class="bg-light py-5">

    <div class="container text-center">

        <h1 class="fw-bold">
            Event Registration
        </h1>

        <p class="text-muted">
            Register for your favorite event
        </p>

    </div>

</section>

<!-- SUCCESS ALERT -->
<div class="container mt-4">

    <div id="successAlert"
         class="alert alert-success d-none">

        🎉 Registration Successful! Thank you for registering.

    </div>

</div>

<!-- FORM -->
<section class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    Registration Form

                </div>

                <div class="card-body">

                    <form id="eventForm">

                        <div class="mb-3">

                            <label class="form-label">
                                Student Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Roll Number
                            </label>

                            <input type="text"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Branch
                            </label>

                            <select class="form-select"
                                    required>

                                <option value="">
                                    Select Branch
                                </option>

                                <option>CSE</option>
                                <option>ECE</option>
                                <option>EEE</option>
                                <option>IT</option>
                                <option>Mechanical</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Mobile Number
                            </label>

                            <input type="tel"
                                   class="form-control"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Event Selection
                            </label>

                            <select class="form-select"
                                    required>

                                <option value="">
                                    Select Event
                                </option>

                                <option>Technical Quiz</option>
                                <option>Hackathon</option>
                                <option>Poster Presentation</option>
                                <option>Coding Contest</option>
                                <option>Project Expo</option>
                                <option>Cultural Fest</option>

                            </select>

                        </div>

                        <button type="submit"
                                class="btn btn-primary">

                            Register

                        </button>

                        <button type="reset"
                                class="btn btn-secondary">

                            Reset

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3">

    <p class="mb-0">
        © 2026 College Event Management System
    </p>

</footer>

<script>
document.getElementById("eventForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    document.getElementById("successAlert")
    .classList.remove("d-none");

    this.reset();

});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
```
